<html>
  <head>
    <meta charset="utf-8">
    <title>Авторизация</title>
    <link rel="stylesheet" href="/styles/auth.css"/>
  </head>
  <body>
    <div>
      <form id="form" action="/auth" method="post" name="authorization" required>
        <!-- логин, пароль, ФИО, компания, должность -->
        <p id="fio_description"></p>
        <input name="login" id="login" type="text" placeholder="Логин" required/>
        <input name="password" id="password" type="password" placeholder="Пароль" required/>
        <input type="submit"/>
        <p id="password_description"></p>
      </form>
    </div>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
