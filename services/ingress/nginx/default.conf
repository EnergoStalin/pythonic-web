	# location /auth {
	# 	proxy_pass http://api;
	# }
	#
	# location /storage {
	# 	client_max_body_size 0;
	# 	proxy_http_version 1.1;
	# 	proxy_set_header Connection "";
	# 	proxy_request_buffering off;
	#
	# 	proxy_pass http://api;
	# }

	location / {
		proxy_pass http://www;
	}
}
