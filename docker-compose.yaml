services:
  postgres:
    image: postgres:18
    env_file:
      - services/database/.env
    volumes:
      - ./data/postgres:/var/lib/postgresql:rw
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - postgres
  api:
    build:
      context: services/api
    env_file:
      - services/database/.env
    environment:
      POSTGRES_HOST: postgres
      STORAGE_PATH: /data/storage
    volumes:
      - ./data/storage:/data/storage:rw
    networks:
      - ingress
      - postgres
  www:
    build:
      context: services/www
    volumes:
      - ./services/www/src:/www:ro
    networks:
      - ingress
  ingress:
    image: nginx:stable-alpine3.23-perl
    volumes:
      - ./services/ingress/nginx:/etc/nginx/conf.d:ro
    ports:
      - 127.0.0.1:8080:80
    networks:
      - ingress

networks:
  ingress:
  postgres:
    name: postgres
